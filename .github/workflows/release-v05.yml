name: Publish v0.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v05.yml'
      - 'release_build/v05_package_b64/**'
      - 'release_build/v05_package_b64_fix/**'
      - 'release_build/upstream_state.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify v0.5 package
        shell: bash
        run: |
          set -euo pipefail
          {
            cat release_build/v05_package_b64/part-aa
            cat release_build/v05_package_b64/part-ab
            cat release_build/v05_package_b64/part-ac
            cat release_build/v05_package_b64/part-ad
            cat release_build/v05_package_b64/part-ae
            cat release_build/v05_package_b64_fix/af-0
            cat release_build/v05_package_b64_fix/tail-00
            head -c 2564 release_build/v05_package_b64_fix/tail-01
            printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
            tail -c +2565 release_build/v05_package_b64_fix/tail-01
            head -c 17 release_build/v05_package_b64_fix/tail-02
            printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
            tail -c +18 release_build/v05_package_b64_fix/tail-02
            cat release_build/v05_package_b64_fix/tail-03
            cat release_build/v05_package_b64_fix/tail-04
            cat release_build/v05_package_b64_fix/tail-05
          } | base64 -d > Ultima1Unity_Korean_v0.5_DeltaPatch.zip
          echo '358a9f7c99ba8214b2f60dc8e74f81578afb65517550e9689e4cfa03c556f2c1  Ultima1Unity_Korean_v0.5_DeltaPatch.zip' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t Ultima1Unity_Korean_v0.5_DeltaPatch.zip
          rm -rf _verify
          mkdir _verify
          unzip -q Ultima1Unity_Korean_v0.5_DeltaPatch.zip -d _verify
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path('_verify/patch_data.json').read_text(encoding='utf-8-sig'))
          assert m['version'] == '0.5'
          files = {x['path']: x for x in m['binary_files']}
          dll = files[r'Ultima I Unity_Data\Managed\Ultima.Runtime.dll']
          assets = files[r'Ultima I Unity_Data\resources.assets']
          assert dll['original_sha256'] == 'd08f5bb3e02c0ecdab37d4c99200984a8a1979d0be6c5a835f9e2b4449fa6852'
          assert dll['patched_sha256'] == 'b332aadfc73b3139ec41fa4fe0ecfba9f0887ce7b9ac318453e15eba1c3bf6e7'
          assert assets['original_sha256'] == '472e002b9fd4e1479614a54ea64e70cebfe5cb5e0f3b67aa1368abdc259c3f49'
          assert assets['patched_sha256'] == '2f3d5ec2fdead02842b11b1b0d95fefa5dce00075b29e2cbabbe1d11136c0da4'
          assert len(dll['patches']) == 504
          assert len(assets['patches']) == 2
          print('v0.5 manifest verification passed')
          PY

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          Ultima I Unity 2026-09-13 빌드 대응 한국어 패치 v0.5입니다.

          주의: 원본 게임은 2026-10-11에 새 빌드를 배포했습니다.
          이 v0.5 델타 패치는 2026-09-13 원본 SHA-256에만 적용되며,
          2026-10-11 빌드와의 호환성은 검증되지 않았습니다.
          해시 검사를 우회하거나 새 버전 파일에 강제 적용하지 마십시오.
          원본 업데이트: https://archiveofmyth.itch.io/ultima-unity/devlog/1702879/new-release-and-update-to-the-game-10112026

          주요 변경
          - 기존 한국어 문자열 1,332개를 최신 DLL 구조로 재이식
          - 성별 선택 / Apple II 캐릭터 UI / 최신 컨트롤러 / Mondain Fight / 옵션 문구 보강
          - 최신 DLL 폰트 참조 209곳을 Galmuri11 경로로 통일
          - 최신 resources.assets에 Galmuri11 재이식
          - 도시·성·던전·상점·아이템 JSON 번역 유지
          - 원본 및 패치 후 SHA-256 검증 유지

          지원 원본 SHA-256
          - Ultima.Runtime.dll: `d08f5bb3e02c0ecdab37d4c99200984a8a1979d0be6c5a835f9e2b4449fa6852`
          - resources.assets: `472e002b9fd4e1479614a54ea64e70cebfe5cb5e0f3b67aa1368abdc259c3f49`

          설치
          1. 2026-09-13 Ultima I Unity 원본 빌드를 깨끗한 상태로 준비합니다.
          2. ZIP을 `Ultima I Unity.exe`가 있는 폴더에 풉니다.
          3. `Install_Korean_Patch.bat`를 실행합니다.

          ※ 원본 게임 파일은 포함하지 않습니다.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.5 \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Ultima I Unity 한국어 패치 v0.5' \
              --notes-file RELEASE_NOTES.md
            gh release upload v0.5 \
              Ultima1Unity_Korean_v0.5_DeltaPatch.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.5 \
              Ultima1Unity_Korean_v0.5_DeltaPatch.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title 'Ultima I Unity 한국어 패치 v0.5' \
              --notes-file RELEASE_NOTES.md
          fi
